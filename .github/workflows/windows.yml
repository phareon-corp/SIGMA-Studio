name: Windows — executável e instalador

# Compila o que não dá para compilar no Linux: PySide6 e o bootloader do
# PyInstaller são binários do alvo. O runner windows-latest faz o papel da
# máquina Windows que packaging/build_windows.ps1 espera.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # só o passo de release usa; os outros não escrevem nada

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -e ".[dev,build]"

      - name: Suíte (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          IA4294_REDUCED_MOTION: "1"
        run: python -m pytest -q

      - name: Ícone
        run: python packaging/make_icon.py

      - name: Congelar com o PyInstaller
        run: python -m PyInstaller --noconfirm packaging/sigma-studio.spec

      - name: Fumaça — o .exe abre, desenha e fecha
        env:
          QT_QPA_PLATFORM: offscreen
          IA4294_REDUCED_MOTION: "1"
        run: |
          # .exe sem console devolve o prompt na hora: sem WaitForExit, o teste
          # olharia o arquivo antes de a janela existir
          $args = "--sim","--sim-speed","0.02","--size","1320x860","--screenshot","dist\fumaca.png"
          $p = Start-Process -FilePath dist\sigma-studio\sigma-studio.exe -ArgumentList $args -PassThru `
               -RedirectStandardOutput dist\fumaca.out -RedirectStandardError dist\fumaca.err
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "o executável não fechou sozinho" }
          Get-Content dist\fumaca.out, dist\fumaca.err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "o executável saiu com código $($p.ExitCode)" }
          if (-not (Test-Path dist\fumaca.png)) { throw "a janela não desenhou" }

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\sigma-studio.iss

      - name: Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: sigma-studio-windows
          path: |
            dist/sigma-studio-*-windows-setup.exe
            dist/fumaca.png
          if-no-files-found: error

      - name: Pasta portátil
        uses: actions/upload-artifact@v4
        with:
          name: sigma-studio-windows-portatil
          path: dist/sigma-studio/
          if-no-files-found: error

      # tag v* vira release com o instalador anexado
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pacote = (Get-Item dist\sigma-studio-*-windows-setup.exe).FullName
          # a release pode já existir (criada pelo pacote do Linux, que sai daqui de fora)
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --generate-notes --title "SIGMA Studio ${{ github.ref_name }}"
          }
          gh release upload "${{ github.ref_name }}" $pacote --clobber
