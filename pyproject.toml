[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia4294"
version = "0.1.0"
description = "Controle e aquisição do analisador de impedância HP/Agilent 4294A via AR488 (GPIB-USB)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "pyqtgraph>=0.13.4",
  "pyserial>=3.5",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.6"]  # empacotamento Windows; ver packaging/

[project.scripts]
ia4294-probe = "ia4294.instrument.probe:main"

[project.gui-scripts]
ia4294 = "ia4294.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ia4294.ui" = ["assets/*.css", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
