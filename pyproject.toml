[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-studio"
version = "0.1.0"
description = "SIGMA Studio — controle e aquisição do analisador de impedância HP/Agilent 4294A via AR488 (GPIB-USB)"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering",
  "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
  "PySide6>=6.6",
  "pyqtgraph>=0.13.4",
  "pyserial>=3.5",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
]

[project.urls]
Homepage = "https://github.com/phareon-corp/SIGMA-Studio"
Repository = "https://github.com/phareon-corp/SIGMA-Studio"
Issues = "https://github.com/phareon-corp/SIGMA-Studio/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.6"]  # empacotamento Windows; ver packaging/

[project.scripts]
sigma-studio-probe = "ia4294.instrument.probe:main"
ia4294-probe = "ia4294.instrument.probe:main"  # nome antigo, mantido

[project.gui-scripts]
sigma-studio = "ia4294.__main__:main"
ia4294 = "ia4294.__main__:main"  # nome antigo, mantido

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ia4294.ui" = ["assets/*.css", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
